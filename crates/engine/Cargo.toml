[package]
name = "simplypdf-engine"
description = "SimplyPDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
simplypdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
simplypdf-render = { workspace = true }
simplypdf-cos = { workspace = true }
simplypdf-organize = { workspace = true }
simplypdf-annot = { workspace = true }
simplypdf-forms = { workspace = true }
simplypdf-xfa = { workspace = true }
simplypdf-edit = { workspace = true }
simplypdf-content = { workspace = true }
simplypdf-audit = { workspace = true }
simplypdf-redact = { workspace = true }
simplypdf-print = { workspace = true }
simplypdf-xfdf = { workspace = true }
simplypdf-sign = { workspace = true }
simplypdf-optimize = { workspace = true }
simplypdf-a11y = { workspace = true }
simplypdf-ocr = { workspace = true }
simplypdf-js = { workspace = true }
simplypdf-compare = { workspace = true }
simplypdf-preflight = { workspace = true }
simplypdf-export = { workspace = true }
simplypdf-fonts = { workspace = true }
simplypdf-create = { workspace = true }
simplypdf-model = { workspace = true }
simplypdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and simplypdf-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
simplypdf-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
simplypdf-filters = { workspace = true }
