[package]
name = "simplypdf-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
simplypdf-fonts = { workspace = true }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
# ocrs 0.13 passes rten Model values across this API; keep both on 0.26.
rten = { version = "=0.27.0", default-features = false, features = ["onnx_format", "rten_format"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.27"
