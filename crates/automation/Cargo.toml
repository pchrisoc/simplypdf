[package]
name = "simplypdf-automation"
description = "Agent control for SimplyPDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
simplypdf-engine = { workspace = true }
simplypdf-cos = { workspace = true }
simplypdf-render = { workspace = true }
simplypdf-organize = { workspace = true }
simplypdf-platform = { workspace = true }
simplypdf-prc = { workspace = true }
simplypdf-prc-render = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
simplypdf-fonts = { workspace = true }
png = "0.18"
flate2.workspace = true
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
simplypdf-model = { workspace = true }
simplypdf-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
