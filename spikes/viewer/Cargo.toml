[package]
name = "simplypdf-viewer-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
simplypdf-core = { path = "../../crates/simplypdf-core" }
simplypdf-draw = { path = "../../crates/simplypdf-draw" }

[dev-dependencies]
libloading = "=0.8.9"
lopdf = { version = "=0.42.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDictionary", "CGPDFObject", "CGPDFDocument", "CGPDFPage"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
